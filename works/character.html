<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>角色材质 · Jonny</title><meta name="description" content="头发、眼球、皮肤、棉、丝绸和丝袜的实时材质练习。"><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../assets/site.css?v=20261027-works"><script defer src="../assets/lookdev.js?v=20261027-works5"></script></head><body id="top"><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="masthead"><a class="wordmark" href="../index.html?v=20261019-daily">Jonny<span> / TECHNICAL ART</span></a><nav aria-label="主导航"><a href="../index.html?v=20261019-daily">首页</a><a href="../articles.html?v=20261018-list">文章</a><a href="../work.html?v=20261027-works" aria-current="page">作品</a><a href="../about.html?v=20261018-ai">关于</a></nav></header><main id="main"><header class="page-intro"><span class="kicker">CHARACTER</span><h1>角色材质</h1><p>同一套光照下换材质模型。拖动可改光的方向。这些是着色练习，不是角色扫描。</p></header><div class="switch" role="tablist" aria-label="角色材质"><button type="button" data-mat="hair" aria-selected="true">头发</button><button type="button" data-mat="eye">眼球</button><button type="button" data-mat="skin">皮肤</button><button type="button" data-mat="cotton">棉织物</button><button type="button" data-mat="silk">丝绸</button><button type="button" data-mat="stocking">丝袜</button></div><figure class="study-stage"><canvas class="lookdev-canvas" data-kind="character" aria-label="角色材质预览"></canvas><figcaption><span class="stage-kicker">本页实时绘制</span><span>拖动改变光源</span></figcaption></figure><div class="work-points"><p><span>01</span>头发用切线方向的两层高光，第二层沿法线偏移并偏暖。</p><p><span>02</span>眼球分开巩膜、虹膜和瞳孔，角膜只加菲涅尔和高光。</p><p><span>03</span>皮肤用包裹漫反射和暗部红色，再叠两档粗糙度。棉是宽高光加绒毛，丝绸沿织线拉高光，丝袜把透射和编织纹叠在一起。</p></div></main><footer><span>© 2026 Jonny</span><span>Visuals · Tools · Production</span><a href="#top" aria-label="回到页面顶部">↑ 返回顶部</a></footer></div></body></html>
