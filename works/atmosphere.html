<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>物理大气 · Jonny</title><meta name="description" content="沿视线积分的 Rayleigh 大气。"><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../assets/site.css?v=20261027-works"><script defer src="../assets/volumes.js?v=20261027-works2"></script></head><body id="top"><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="masthead"><a class="wordmark" href="../index.html?v=20261019-daily">Jonny<span> / TECHNICAL ART</span></a><nav aria-label="主导航"><a href="../index.html?v=20261019-daily">首页</a><a href="../articles.html?v=20261018-list">文章</a><a href="../work.html?v=20261027-works" aria-current="page">作品</a><a href="../about.html?v=20261018-ai">关于</a></nav></header><main id="main"><header class="page-intro"><span class="kicker">ATMOSPHERE</span><h1>物理大气</h1><p>蓝光散射更强，所以天顶更蓝，靠近太阳的方向留下更暖的光。拖动可把太阳拉低。</p></header><figure class="study-stage"><canvas class="volume-canvas" data-volume="sky" aria-label="物理大气"></canvas><figcaption><span class="stage-kicker">本页实时绘制</span><span>拖动改变太阳高度</span></figcaption></figure><div class="work-points"><p><span>01</span>沿视线采样高度，密度随高度下降。</p><p><span>02</span>Rayleigh 相位是 1 + cos²θ。波长用蓝大于绿、绿大于红的相对系数，不是实验室标定值。</p></div><p class="work-note">这是单次散射的大气练习，没有臭氧层，也没有和体积云合成。</p></main><footer><span>© 2026 Jonny</span><span>Visuals · Tools · Production</span><a href="#top" aria-label="回到页面顶部">↑ 返回顶部</a></footer></div></body></html>
