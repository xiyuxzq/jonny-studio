<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>场景材质 · Jonny</title><meta name="description" content="建筑混合、地形、植物、石头和水体的实时材质练习。"><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../assets/site.css?v=20261027-works"><script defer src="../assets/lookdev.js?v=20261027-works5"></script></head><body id="top"><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="masthead"><a class="wordmark" href="../index.html?v=20261019-daily">Jonny<span> / TECHNICAL ART</span></a><nav aria-label="主导航"><a href="../index.html?v=20261019-daily">首页</a><a href="../articles.html?v=20261018-list">文章</a><a href="../work.html?v=20261027-works" aria-current="page">作品</a><a href="../about.html?v=20261018-ai">关于</a></nav></header><main id="main"><header class="page-intro"><span class="kicker">ENVIRONMENT</span><h1>场景材质</h1><p>混合、坡度和透射都在着色器里决定。拖动可改光的方向。</p></header><div class="switch" role="tablist" aria-label="场景材质"><button type="button" data-mat="building" aria-selected="true">建筑混合</button><button type="button" data-mat="terrain">地形</button><button type="button" data-mat="plant">植物</button><button type="button" data-mat="stone">石头</button><button type="button" data-mat="water">水体</button></div><figure class="study-stage"><canvas class="lookdev-canvas" data-kind="environment" aria-label="场景材质预览"></canvas><figcaption><span class="stage-kicker">本页实时绘制</span><span>拖动改变光源</span></figcaption></figure><div class="work-points"><p><span>01</span>建筑用噪声高度决定粉刷盖住多少砖缝。</p><p><span>02</span>地形用坡度分配草、土和石头。植物背面透出更亮的绿。</p><p><span>03</span>石头的凹陷压暗并变粗。水面用菲涅尔在吸收色和天空反射之间混合。</p></div></main><footer><span>© 2026 Jonny</span><span>Visuals · Tools · Production</span><a href="#top" aria-label="回到页面顶部">↑ 返回顶部</a></footer></div></body></html>
