<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#eeeeee"/></marker><style>text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#e4e4e4;font-size:17px}.small{font-size:13px;fill:#a5a5a5}.label{font-size:12px;fill:#eeeeee;letter-spacing:1.5px}.title{font-size:24px;font-weight:500}.line{stroke:#555555;stroke-width:1.5;fill:none}.ray{stroke:#eeeeee;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="420" rx="8" fill="#191919"/><text x="35" y="44" class="label">CHARACTER PASSES / 一个角色通常由哪几部分着色拼成</text><rect x="35" y="95" width="198" height="150" rx="5" fill="#262626" stroke="#585858"/><text x="51" y="132">材质分区</text><text x="51" y="170" class="small">ILM / ORM / 顶点色</text><text x="51" y="200" class="small">按部位分配 Shader</text><path class="ray" d="M234 170 L246 170"/><rect x="247" y="95" width="198" height="150" rx="5" fill="#262626" stroke="#585858"/><text x="263" y="132">漫反射</text><text x="263" y="170" class="small">Ramp + 阈值</text><text x="263" y="200" class="small">脸部改用 SDF 阈值图</text><path class="ray" d="M446 170 L458 170"/><rect x="459" y="95" width="198" height="150" rx="5" fill="#262626" stroke="#585858"/><text x="475" y="132">高光</text><text x="475" y="170" class="small">GGX / Kajiya-Kay / MatCap</text><text x="475" y="200" class="small">头发、金属、布料各自一套</text><path class="ray" d="M658 170 L670 170"/><rect x="671" y="95" width="198" height="150" rx="5" fill="#262626" stroke="#585858"/><text x="687" y="132">描边</text><text x="687" y="170" class="small">背面外扩</text><text x="687" y="200" class="small">平滑法线 + 顶点色线宽</text><path class="ray" d="M870 170 L882 170"/><rect x="883" y="95" width="198" height="150" rx="5" fill="#262626" stroke="#585858"/><text x="899" y="132">特殊处理</text><text x="899" y="170" class="small">Stencil / 深度偏移</text><text x="899" y="200" class="small">眼睛透发、刘海投影、自阴影</text><path class="line" d="M35 285 L1085 285"/><text x="35" y="322" class="small">共用输入：主光方向（可与场景光分离）· 头部骨骼朝向 · 相机方向 · 曝光与后处理</text><text x="35" y="360" class="small">各部分的分区信息都来自贴图（ILM、SDF、遮罩）或顶点色，因此美术可以按部位单独调整。</text></svg>