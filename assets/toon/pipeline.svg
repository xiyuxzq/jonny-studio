<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img"><defs><linearGradient id="rainbow" x1="0" x2="1"><stop stop-color="#a2c9ff"/><stop offset=".3" stop-color="#dca7f0"/><stop offset=".6" stop-color="#f5d293"/><stop offset="1" stop-color="#99e4c9"/></linearGradient><linearGradient id="fade"><stop stop-color="#c6f594"/><stop offset="1" stop-color="#477354"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#c6f594"/></marker><style>text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#dce7d3;font-size:17px}.small{font-size:13px;fill:#99ad8d}.label{font-size:12px;fill:#c6f594;letter-spacing:1.5px}.title{font-size:24px;font-weight:500}.line{stroke:#4c6042;stroke-width:1.5;fill:none}.ray{stroke:#c6f594;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="450" rx="8" fill="#192117"/><text x="35" y="44" class="label" text-anchor="start">CHARACTER SHADING / 角色渲染的五层控制</text><text x="35" y="87" class="title" text-anchor="start">先建立共同的画面规则，再给每种材质保留区别。</text><rect x="35" y="130" width="192" height="107" rx="5" fill="#222f1c" stroke="#506744"/><text x="50" y="168" class="" text-anchor="start">几何与法线</text><text x="50" y="207" class="small" text-anchor="start">轮廓 / 体积 / 切线</text><path class="ray" d="M229 181 L245 181"/><rect x="249" y="130" width="192" height="107" rx="5" fill="#222f1c" stroke="#506744"/><text x="264" y="168" class="" text-anchor="start">明暗分层</text><text x="264" y="207" class="small" text-anchor="start">Ramp / 阈值 / 遮罩</text><path class="ray" d="M443 181 L459 181"/><rect x="463" y="130" width="192" height="107" rx="5" fill="#222f1c" stroke="#506744"/><text x="478" y="168" class="" text-anchor="start">材质响应</text><text x="478" y="207" class="small" text-anchor="start">高光 / 绒光 / 折射</text><path class="ray" d="M657 181 L673 181"/><rect x="677" y="130" width="192" height="107" rx="5" fill="#222f1c" stroke="#506744"/><text x="692" y="168" class="" text-anchor="start">光照整合</text><text x="692" y="207" class="small" text-anchor="start">主光 / 阴影 / 环境</text><path class="ray" d="M871 181 L887 181"/><rect x="891" y="130" width="192" height="107" rx="5" fill="#222f1c" stroke="#506744"/><text x="906" y="168" class="" text-anchor="start">采样与输出</text><text x="906" y="207" class="small" text-anchor="start">过滤 / LOD / 色调映射</text><path class="line" d="M35 282 L1085 282"/><text x="35" y="320" class="small" text-anchor="start">共享规则：亮暗层级、主光方向、描边尺度、曝光与色彩空间</text><rect x="35" y="349" width="246" height="53" rx="4" fill="#10190e"/><text x="50" y="382" class="small" text-anchor="start">皮肤：脸部可读性</text><rect x="303" y="349" width="246" height="53" rx="4" fill="#10190e"/><text x="318" y="382" class="small" text-anchor="start">头发：高光形状</text><rect x="571" y="349" width="246" height="53" rx="4" fill="#10190e"/><text x="586" y="382" class="small" text-anchor="start">眼睛：视线与深度</text><rect x="839" y="349" width="246" height="53" rx="4" fill="#10190e"/><text x="854" y="382" class="small" text-anchor="start">时装：材料层次</text></svg>